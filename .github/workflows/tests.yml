name: tests
on:
  push:
  pull_request:

jobs:
  router:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false        # the model weights are not needed: tests that run the models are skipped without them
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: router/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/unit tests/api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
